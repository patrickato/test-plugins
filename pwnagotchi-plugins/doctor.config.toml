# PwnDoctor v1.0.0-rc1 — complete example configuration
# Copy the settings you want into /etc/pwnagotchi/config.toml.
# PwnDoctor itself uses only the Python standard library. Optional Linux/Pi commands are
# capability probes; missing commands reduce coverage instead of preventing plugin load.

main.plugins.doctor.enabled = true

# ---------------------------- Standing Orders / autonomy -------------------------------
# off          = diagnose is effectively inactive for treatment
# observe      = diagnose + explain only
# notify       = observe semantics; reserved for notification integrations
# conservative = safe eligible remedies may run automatically (recommended after validation)
# assertive    = risky allow-listed remedies may also run, subject to every other gate
main.plugins.doctor.autofix = "observe"

# Recommended for first boot. Shows what Doctor would do without mutating the device.
main.plugins.doctor.dry_run = true

# Condition IDs Doctor must never auto-treat.
main.plugins.doctor.disable_autofix = []

# Condition IDs that always require one-tap owner confirmation.
main.plugins.doctor.confirm_required = []

# Owner veto on specific actions.
# Available actions:
# restart_service, rfkill_unblock, set_time, remount_rw, make_handshakes_dir,
# prune_logs, stop_wpa_supplicant, vacuum_journal, restore_config, quarantine_plugin
main.plugins.doctor.deny_actions = []

# Reboot-class actions remain confirmation-gated by default.
main.plugins.doctor.allow_reboot_actions = false

# ---------------------------- Learning / recurrence ------------------------------------
# Doctor remembers verified remedy outcomes per patient. History NEVER grants extra authority.
# If a remedy has at least efficacy_min_verified proven outcomes and its verified success rate
# is below efficacy_hold_below, automatic treatment is reduced to owner confirmation.
main.plugins.doctor.efficacy_min_verified = 4
main.plugins.doctor.efficacy_hold_below = 0.25

# ---------------------------- Scan / diagnostic behavior -------------------------------
# Full scan every N epochs. 0 = startup/web/manual scans only.
main.plugins.doctor.scan_every = 30
main.plugins.doctor.boot_grace_s = 25

# Core thresholds.
main.plugins.doctor.min_free_mb = 200
main.plugins.doctor.max_temp_c = 80
main.plugins.doctor.journal_max_mb = 200
main.plugins.doctor.journal_keep_mb = 100
main.plugins.doctor.restart_loop_threshold = 5

# Services to inspect.
main.plugins.doctor.services = ["pwnagotchi", "bettercap", "pwngrid-peer"]

# ---------------------------- Paths / durable state ------------------------------------
main.plugins.doctor.log_path = "/etc/pwnagotchi/log/pwnagotchi.log"
main.plugins.doctor.config_path = "/etc/pwnagotchi/config.toml"
main.plugins.doctor.handshakes = "/root/handshakes"
main.plugins.doctor.incident_path = "/etc/pwnagotchi/doctor_incidents.json"
main.plugins.doctor.breaker_path = "/etc/pwnagotchi/doctor_breaker.json"

# Patient Chart v2: bounded device identity, coverage, recurrence and remedy history.
main.plugins.doctor.patient_path = "/var/lib/pwnagotchi/doctor/patient.json"

# Known-good generations. load/diff defaults to the newest; older generations remain available.
main.plugins.doctor.checkpoint_path = "/etc/pwnagotchi/doctor_known_good.json"
main.plugins.doctor.checkpoint_generations = 5

# ---------------------------- Condition Packs ------------------------------------------
# Owner/local packs. Explain-only unless you explicitly opt into allow-listed remedies.
main.plugins.doctor.condition_dir = "/etc/pwnagotchi/doctor.d"
main.plugins.doctor.allow_pack_remedies = false

# Optional cached catalog. Packs staged here are ALWAYS explain-only, even if they name a remedy.
main.plugins.doctor.catalog_dir = "/var/lib/pwnagotchi/doctor/catalog.d"
main.plugins.doctor.enable_cached_catalog = false

# ---------------------------- Specialist provider hub ----------------------------------
# Sibling plugins may publish read-only pwndoctor/provider/v1 JSON snapshots here.
# /run is normally tmpfs, avoiding SD-card write churn. Provider findings cannot carry actions.
main.plugins.doctor.provider_dir = "/run/pwnagotchi/health.d"
main.plugins.doctor.provider_max_age_s = 300

# ---------------------------- Support bundle -------------------------------------------
# WebUI can generate a sanitized support ZIP. Inspect it before public sharing.
main.plugins.doctor.support_dir = "/var/lib/pwnagotchi/doctor"
main.plugins.doctor.support_log_lines = 400

# ---------------------------- UI --------------------------------------------------------
# Small "dr:" field position on the Pwnagotchi display.
main.plugins.doctor.position = "0,0"
