name: PwnDoctor collaboration tests

on:
  push:
    branches:
      - "openai/pwndoctor-v0.6-collab"
  pull_request:
    paths:
      - "pwnagotchi-plugins/doctor.py"
      - "pwnagotchi-plugins/doctor.config.toml"
      - "pwnagotchi-plugins/CONDITION_PACK_SCHEMA.md"
      - "pwnagotchi-plugins/tests/**"
      - ".github/workflows/pwndoctor-tests.yml"

jobs:
  doctor-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwnagotchi-plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
